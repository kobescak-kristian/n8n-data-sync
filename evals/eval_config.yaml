# Eval gate: n8n data sync with checks (Q-129, Upwork portfolio item 4)
# Committed before any workflow code (eval-gate hard rule 1). The workflow is
# built against this gate, never the reverse. Frozen once committed (eval-gate
# section 7): cases and expected results, grading, level, runs. A change applies
# only to the next version, by a new dated version of this file and a note in
# evals/RESULTS.md; the old version stays in git history.
version: 4
date: 2026-10-26
plan: "BLUEPRINT.md v1.4 (LOCKED 2026-10-20; v1.3 records the R1 changes, v1.4 gate v4), section 5"
